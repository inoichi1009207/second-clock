# ============================================================================
# 第二时钟 —— 你的药，开封后还能用多久
# nginx server 块  ·  2c.klinik.ren  ·  腾讯云 Lighthouse（香港）
#
# 安装位置：/etc/nginx/sites-available/2c.klinik.ren.conf
#           软链到 /etc/nginx/sites-enabled/
# 依赖：本机 127.0.0.1:8791 上跑着 proxy.mjs（见 systemd-2c-proxy.service）
#
# ---------------------------------------------------------------------------
# 证书签发（先跑这条，再启用本文件的 443 块，否则 nginx 因找不到证书起不来）：
#
#   sudo certbot certonly --webroot -w /var/www/2c.klinik.ren -d 2c.klinik.ren
#
# （2026-08-09 现场核实后改：本机 Let's Encrypt 账户是无邮箱注册的，certbot 会
#  自动复用该账户，-m 对已注册账户不生效，故删去 --agree-tos -m ... --no-eff-email。
#  切勿跑 certbot update_account -m ——那会改掉全机所有证书的联系人，含 klinik.ren。）
#
# 签发前必须已有一个能响应 http://2c.klinik.ren/.well-known/ 的临时 HTTP 块，
# 完整先后顺序见 DEPLOY.md 第 7 步。续期由 certbot 的 systemd timer 自动完成，
# 验证：sudo certbot renew --dry-run
# ---------------------------------------------------------------------------

# ---- gzip 已下移进 443 server 块（2026-08-09，现场核实后改）-----------------
# 原先这一节写在文件顶层，而 sites-enabled/* 是被 include 进 http{} 的，
# 于是它和 /etc/nginx/nginx.conf:46 已有的 `gzip on;` 落在同一个 http 上下文里
# —— nginx 对 flag 型指令重复声明直接判 "is duplicate"，`nginx -t` 当场失败，
# 而本机 nginx 与生产站 klinik.ren 共用同一实例，配置不过就等于新站上不去。
# 另一个理由更要紧：即便只删 `gzip on` 保留其余几条，gzip_types / gzip_min_length
# 仍留在 http 层，会连带改掉 klinik.ren 的压缩行为——本站配置绝不该外溢到主站。
# 故全部 gzip 指令移入本文件的 443 server 块（gzip* 在 server 上下文合法）。

# ---- 并发闸（http 上下文；limit_conn_zone 只能写在 http 里）------------------
# 为什么需要它：proxy.mjs 把请求体与响应体**整份读进内存**（单请求上限 12 MiB，
# 峰值约 2×），而 systemd unit 里 MemoryMax=512M。若不限并发，十几个大图识别
# 同时打进来就会触发 cgroup OOM kill —— 而 OOM kill 配合 Restart=always +
# StartLimitBurst=5 等于"连崩五次进 failed 永久停服"。所以内存上限必须和
# 并发上限成对出现，只调其中一个都是自欺。
#
# 【上下文与命名的安全性说明 —— 这一段是本节存在的前提，改动前务必读完】
# 本文件被 include 进 /etc/nginx/nginx.conf 的 http{} 块，故此处的顶层指令就落在
# http 上下文里，limit_conn_zone 写在这里是合法的（它不能写进 server/location）。
# 但"落在 http 上下文"同时意味着**它对全机所有站点可见**，一旦重名就会和别人打架
# （nginx 对同名 zone 直接判 "duplicate zone"，`nginx -t` 整体失败，而本机 nginx
#  与生产站 klinik.ren 共用同一实例 —— 配置非法态下谁 restart 谁把主站一起弄下线）。
# 已于 2026-08-09 现场核实：全机 nginx.conf / sites-enabled / conf.d 中**没有任何
# limit_conn_zone、limit_req_zone 或 map 定义**（sites-enabled 里只有 klinik 一个站），
# 故不存在同名风险。zone 名仍刻意取了带站点前缀的 `second_clock_api_conn`，
# 使它即便将来与别人共处也不会撞。
# 注意：定义 zone 本身不改变任何站点的行为 —— 真正生效的是下面 /api/ location 里的
# `limit_conn`，那条只写在本站的 location 内，绝不外溢到 klinik.ren。
#
# 10m 的共享内存约可跟踪 16 万个 IP，远超本站量级；跑满后新 IP 会被拒（503），
# 不会静默失效。
limit_conn_zone $binary_remote_addr zone=second_clock_api_conn:10m;

# 触闸时返回 429 而不是默认的 503：前端把 429 归为"可重试"类并会自动退避，
# 503 则会被当成服务故障弹错。语义也更准 —— 这是限流，不是服务不可用。
limit_conn_status 429;

# ---- 缓存策略查表（http 上下文；map 不能写在 server 里）---------------------
# 为什么用 map 而不是在各 location 里写 add_header：
# nginx 的 add_header 一旦出现在子块，就会**丢弃**父块继承来的全部 add_header。
# 若在 location 里补一句 Cache-Control，本文件 server 级的 CSP / HSTS 等安全头
# 会在那些路径上**静默消失**。所以全部 add_header 只在 server 级出现一次，
# 按路径变化的那条改用变量。
map $uri $second_clock_cache {
    default                              "no-cache";           # 单文件应用：每次回源校验，靠 ETag 走 304
    ~^/api/                              "no-store";           # 接口一律不缓存
    ~*\.(?:ico|png|svg|webp|jpg|jpeg|gif|woff2?)$  "public, max-age=2592000, immutable";
}

# ---- 80：只做跳转与 ACME 验证 ----------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name 2c.klinik.ren;

    # 验证目录必须匹配在跳转之前，否则 certbot 续期会被 301 打断。
    # `^~` 使该前缀一旦命中就不再比对下面的正则/跳转。
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/2c.klinik.ren;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：站点主体 ----------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name 2c.klinik.ren;

    # 【2026-08-09 现场核实后改：原为 `listen 443 ssl http2;`，会打挂 nginx -t】
    # 本机 nginx 1.24.0，该版本里 http2 是 **listen 套接字级**选项，而同一个
    # address:port 上只允许一个 server 块声明套接字级选项。实测既有站点已占用：
    #     /etc/nginx/sites-enabled/klinik:20  listen 443 ssl default_server;
    # 我方若再带 http2，nginx 报 "duplicate listen options for [::]:443"，
    # `nginx -t` 整体失败 —— 而这台 nginx 与生产站 klinik.ren 共用，配置非法态下
    # 一旦有人 restart 或机器重启，klinik.ren 会一起下线。故此处不带任何套接字级选项。
    # 代价：本站走 HTTP/1.1（该 443 套接字本来也没开 http2，主站同样是 1.1），
    # 单文件应用配合 gzip 已足够快，不值得为它去动主站的监听选项。
    # 若将来 nginx 升到 ≥1.25.1，可改用块内的 `http2 on;`（那时它不再是套接字级选项）。

    ssl_certificate     /etc/letsencrypt/live/2c.klinik.ren/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2c.klinik.ren/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root    /var/www/2c.klinik.ren;
    index   index.html;
    charset utf-8;

    # ---- gzip（只作用于本站，不外溢到 klinik.ren）--------------------------
    # http{} 里已有 `gzip on;`，此处在 server 上下文重声明是合法覆盖，不是重复。
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      image/svg+xml application/manifest+json;
    # 注：text/html 恒被 gzip 处理，无需（也不能）写进 gzip_types。

    access_log /var/log/nginx/2c.klinik.ren.access.log;
    error_log  /var/log/nginx/2c.klinik.ren.error.log warn;

    # 识别请求含 base64 照片。这里留 14m，比 proxy.mjs 的 12 MiB 上限宽一点，
    # 好让超限时命中 proxy 的中文提示（"图片过大…"），而不是 nginx 的裸 413 页。
    client_max_body_size 14m;
    client_body_timeout  120s;

    # ---- 响应头：全部集中在此，子块不再出现 add_header ----------------------
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 拍照识别要用摄像头，故 camera=(self)；其余能力一律关闭
    add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;
    add_header Cache-Control             $second_clock_cache                always;

    # CSP：connect-src 'self' 是本站最硬的一道护栏——
    # 即便将来前端被误改回直连 open.bigmodel.cn，浏览器也会直接拦掉，
    # 于是"密钥只在服务端"这条不变量不会被一次手滑破坏。
    # 单文件应用内联了 <script> 与 <style>，故必须保留 'unsafe-inline'。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- API 反代 ----------------------------------------------------------
    # 路径白名单由 proxy.mjs 强制（只认 /api/zhipu/chat 与 /api/zhipu/search，
    # 其余一律 404），这里放行整个 /api/ 前缀即可。
    location /api/ {
        # 每个客户端 IP 最多 3 条并发到 /api/。识别是"拍一张等一张"的交互，
        # 正常用户并发 1，偶有重试并发 2；给到 3 已经很宽。这条闸护的是内存：
        # 见本文件顶部 limit_conn_zone 的说明与 systemd unit 里的 MemoryMax=512M。
        # 单 IP 并发闸挡不住"多 IP 一起打"（那由 proxy.mjs 的全局配额兜），
        # 但它挡住了最省事的那种打法：一个人开一百个标签页。
        limit_conn second_clock_api_conn 3;

        proxy_pass         http://127.0.0.1:8791;

        # proxy.mjs 用 Origin/Referer 做来源校验，这两个头必须原样透传。
        # nginx 默认会把它们带上（未被 proxy_set_header 覆盖的请求头一律转发），
        # 此处显式写出，是为了防止将来有人加一条 proxy_set_header 时误伤 ——
        # 一旦 Origin 丢失，所有前端调用会当场变 403。
        proxy_set_header   Origin            $http_origin;
        proxy_set_header   Referer           $http_referer;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # proxy.mjs 自己也发这两个头（它要能独立自洽地跑）。若不藏掉上游那份，
        # 响应里会出现两条同名头。这里统一以 nginx 的为准。
        # 注意：proxy_hide_header 不是 add_header，不触发"子块清空父块头"的坑。
        proxy_hide_header  Cache-Control;
        proxy_hide_header  X-Content-Type-Options;

        # 识别请求上游可能思考 60s 以上；proxy.mjs 侧上限 120s，这里留到 130s
        proxy_connect_timeout 10s;
        proxy_send_timeout    130s;
        proxy_read_timeout    130s;

        # 先收全请求体再转发：大图上传时不让慢客户端占住 node 的连接
        proxy_request_buffering on;
        proxy_buffering         off;
    }

    # ---- 静态直出 ----------------------------------------------------------
    location = / {
        try_files /index.html =404;
    }

    # 隐藏文件一律拒绝（.git / .env 之类误传上来时的兜底）
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
